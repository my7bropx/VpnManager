[package]
name = "vpn-manager"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "vpn-manager"
path = "src/main.rs"

[dependencies]
clap             = { version = "=4.3.24", features = ["derive"] }
ratatui          = "=0.21.0"
crossterm        = "=0.26.1"
serde            = { version = "1", features = ["derive"] }
serde_json       = "1"
anyhow           = "1"
nix              = { version = "=0.26.4", features = ["signal", "process"] }
tempfile         = "=3.8.1"
libc             = "0.2"

# Force transitive pins for Rust 1.75 compatibility
unicode-segmentation = "=1.10.1"
getrandom        = "=0.2.11"
